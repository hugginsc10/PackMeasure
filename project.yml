name: PackMeasure

options:
  bundleIdPrefix: com.chasstudio
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SMCQX7ZNDA
    CURRENT_PROJECT_VERSION: "59"
    MARKETING_VERSION: "0.2.0"

targets:
  PackMeasure:
    type: application
    platform: iOS
    sources:
      - path: PackMeasure
    info:
      path: PackMeasure/Info.plist
      properties: &appInfo
        CFBundleDisplayName: PackMeasure
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: PackMeasure uses the camera and LiDAR depth sensor to measure objects and rooms.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
          - arkit
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasstudio.PackMeasure
        PRODUCT_NAME: PackMeasure
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"

  PackMeasureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PackMeasureTests
    dependencies:
      - target: PackMeasure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasstudio.PackMeasureTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  # Simulator-only QA app: the real app sources with synthetic fixtures in
  # place of PackMeasureApp.swift. Built for the test action only, never
  # archived, so fixtures cannot reach the shipping app.
  PackMeasureQA:
    type: application
    platform: iOS
    sources:
      - path: PackMeasure
        excludes:
          - PackMeasureApp.swift
          - Info.plist
      - path: PackMeasureQA
    info:
      path: PackMeasureQA/Info.plist
      properties:
        <<: *appInfo
        CFBundleDisplayName: PackMeasure QA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasstudio.PackMeasureQA
        PRODUCT_NAME: PackMeasureQA
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"

  PackMeasureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PackMeasureUITests
    dependencies:
      - target: PackMeasureQA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasstudio.PackMeasureUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: PackMeasureQA

schemes:
  PackMeasure:
    build:
      targets:
        PackMeasure: all
        PackMeasureTests: [test]
        PackMeasureQA: [test]
        PackMeasureUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PackMeasureTests
        - PackMeasureUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
