name: PackMeasure

options:
  bundleIdPrefix: com.chashuggins
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  PackMeasure:
    type: application
    platform: iOS
    sources:
      - path: PackMeasure
      - path: Core
        optional: true
      - path: Scan
        optional: true
      - path: UI
        optional: true
    info:
      path: PackMeasure/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chashuggins.PackMeasure
        PRODUCT_NAME: PackMeasure
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  PackMeasureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PackMeasureTests
        optional: true
    dependencies:
      - target: PackMeasure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chashuggins.PackMeasureTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  PackMeasure:
    build:
      targets:
        PackMeasure: all
        PackMeasureTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PackMeasureTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
