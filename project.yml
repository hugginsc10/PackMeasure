name: PackMeasure

options:
  bundleIdPrefix: com.chasstudio
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SMCQX7ZNDA
    CURRENT_PROJECT_VERSION: "5"
    MARKETING_VERSION: "0.1.4"

targets:
  PackMeasure:
    type: application
    platform: iOS
    sources:
      - path: PackMeasure
    info:
      path: PackMeasure/Info.plist
      properties:
        CFBundleDisplayName: PackMeasure
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: PackMeasure uses the camera and LiDAR depth sensor to measure boxes and objects.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
          - arkit
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasstudio.PackMeasure
        PRODUCT_NAME: PackMeasure
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"

  PackMeasureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PackMeasureTests
    dependencies:
      - target: PackMeasure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasstudio.PackMeasureTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  PackMeasure:
    build:
      targets:
        PackMeasure: all
        PackMeasureTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PackMeasureTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
